name: Feature request
description: Propose a focused improvement to OpenTag.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and pull requests for this request.
          required: true
        - label: This request does not include credentials or private data.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or operator problem should OpenTag solve?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behavior and how success could be verified.
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Scope and constraints
      description: Note affected providers, privacy or authorization boundaries, compatibility needs, and anything explicitly out of scope.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What can users do today, and why is it insufficient?
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: Additional context
      description: Add sanitized examples, diagrams, or links that clarify the request.
    validations:
      required: false
